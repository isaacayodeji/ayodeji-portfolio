  <body>
    <!-- React replaces everything inside #root once the app loads. If you can read this, the source
         file was opened directly instead of the compiled site. -->
    <div id="root">
      <div style="font-family:system-ui,sans-serif;color:#cbd5e1;background:#070a1a;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
        <div style="max-width:520px;line-height:1.6">
          <h1 style="color:#fff;font-size:22px;margin-bottom:12px">This is the source file, not the built site</h1>
          <p>Browsers can't run <code>src/main.jsx</code> directly. Start the site with
            <code style="background:#172554;padding:2px 8px;border-radius:6px">npm run dev</code>
            and open <b>http://localhost:5173</b>, or open <b>dist/index.html</b> after
            <code style="background:#172554;padding:2px 8px;border-radius:6px">npm run build</code>.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
